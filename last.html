<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Beautiful Memories ✨</title>
    <link rel="stylesheet" href="sunset.css?v=6">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@300;400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Quicksand', sans-serif;
            overflow-x: hidden;
            color: #4a4a4a;
        }

        @keyframes gradientFlow {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* Enhanced Sparkle Effect */
        .magic-sparkles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: white;
            animation: twinkle var(--duration, 4s) ease-in-out infinite;
            opacity: 0;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0;
                transform: scale(0.5);
            }

            50% {
                opacity: 0.8;
                transform: scale(1);
            }
        }

        /* Generate 50 sparkles with different positions and animations */
        .magic-sparkles::before,
        .magic-sparkles::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle, white 1px, transparent 1px);
            background-size: 50px 50px;
            animation: sparkleLayer 8s linear infinite;
            opacity: 0.5;
        }

        .magic-sparkles::after {
            animation-delay: -4s;
            transform: rotate(45deg);
        }

        @keyframes sparkleLayer {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-50px);
            }
        }

        /* Floating Hearts */
        .floating-hearts {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .heart {
            position: absolute;
            font-size: 1.5rem;
            color: rgba(255, 140, 58, 0.7);
            animation: floatHeart var(--float-duration, 6s) ease-in-out infinite;
            animation-delay: var(--delay, 0s);
        }

        @keyframes floatHeart {
            0% {
                transform: translate(0, 100vh) rotate(0deg);
            }

            100% {
                transform: translate(var(--translate-x, 0), -100vh) rotate(360deg);
            }
        }

        /* Welcome Section */
        .welcome {
            text-align: center;
            padding: 4rem 2rem;
            position: relative;
            z-index: 3;
        }

        .welcome h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            color: var(--ink);
            text-shadow: 0 2px 12px rgba(255, 255, 255, 0.7);
            animation: fadeInScale 2s ease;
        }

        .welcome p {
            font-size: 1.2rem;
            max-width: 600px;
            margin: 1.5rem auto;
            line-height: 1.6;
            animation: fadeIn 2s ease 0.5s both;
        }

        /* Enhanced Memory Cards */
        .memory-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            z-index: 3;
            position: relative;
        }

        .memory-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .memory-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }

        .memory-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transform: translateX(-100%);
            transition: 0.5s;
        }

        .memory-card:hover::before {
            transform: translateX(100%);
        }

        .memory-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 1rem;
            transition: transform 0.5s ease;
        }

        .memory-card:hover .memory-img {
            transform: scale(1.05);
        }

        .memory-date {
            font-family: 'Dancing Script', cursive;
            color: #c85a14;
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }

        .memory-caption {
            font-size: 1rem;
            line-height: 1.5;
            color: #666;
        }

        /* Final Message Section */
        .final-message {
            text-align: center;
            padding: 4rem 2rem;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(10px);
            margin-top: 3rem;
            position: relative;
            z-index: 3;
        }

        .final-message h2 {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            color: var(--ink);
            margin-bottom: 2rem;
            animation: heartbeat 2s infinite;
        }

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        .final-message p {
            font-size: 1.2rem;
            max-width: 800px;
            margin: 0 auto 2rem;
            line-height: 1.8;
        }

        .goodbye-btn {
            display: inline-block;
            padding: 1rem 2rem;
            font-size: 1.2rem;
            background: var(--btn);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.85);
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(15, 44, 82, 0.35);
            animation: float 3s infinite ease-in-out;
        }

        .goodbye-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(255, 140, 58, 0.7);
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        /* Animations */
        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        /* Generate Hearts */
        .js-generate-hearts {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        /* Single card + goodbye button, centred on screen */
        .single {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2.5rem;
            padding: 2rem 16px;
            position: relative;
            z-index: 3;
        }

        .single .memory-card {
            width: 100%;
            max-width: 420px;
        }

        /* show the whole square illustration instead of a 250px crop */
        .single .memory-img {
            height: auto;
            aspect-ratio: 1 / 1;
        }

        .single .memory-date {
            text-align: center;
            font-size: 1.8rem;
            margin: 0;
        }

        /* Custom Scrollbar */        ::-webkit-scrollbar {
            width: 12px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.4);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--btn);
            border-radius: 6px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .welcome h1 {
                font-size: 3rem;
            }

            .memory-container {
                grid-template-columns: 1fr;
            }

            .final-message h2 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="magic-sparkles"></div>
    <div class="floating-hearts">
        <!-- Hearts will be generated via CSS -->
        <div class="heart" style="--float-duration: 6s; --delay: 0s; --translate-x: 20px;">⭐</div>
        <div class="heart" style="--float-duration: 8s; --delay: 1s; --translate-x: -30px;">🐬</div>
        <div class="heart" style="--float-duration: 7s; --delay: 2s; --translate-x: 40px;">🌊</div>
        <div class="heart" style="--float-duration: 9s; --delay: 3s; --translate-x: -20px;">🐚</div>
        <div class="heart" style="--float-duration: 5s; --delay: 4s; --translate-x: 30px;">✨</div>
    </div>

    <main class="single">
        <div class="memory-card">
            <img src="./d1.jpg?v=2" alt="First Date" class="memory-img">
            <div class="memory-date">Selamat Hari Tua🐱</div>
        </div>
        <a href="home.html" class="goodbye-btn">byee👋</a>
    </main>
    <script src="music.js?v=5"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <style>
        /* Persistent shell: pages load in the frame, music lives here so it never reloads */
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #0f2c52;
        }

        #site {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
    </style>
</head>
<body>
    <iframe id="site" src="home.html?v=6" title="Happy Birthday"></iframe>
    <script src="music.js?v=5"></script>
</body>
</html>
